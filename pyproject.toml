[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "redteam-br"
version = "0.1.0"
description = "Red-teaming de LLMs em português: ataques do OWASP LLM Top 10, mutadores e defesas medidas antes e depois"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Arthur Penedo" }]
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
redteam-br = "redteam_br.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
redteam_br = ["dados/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
